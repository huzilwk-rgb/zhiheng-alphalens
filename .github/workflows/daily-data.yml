name: Daily market data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 21 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install free-data clients
        run: pip install -r requirements.txt

      - name: Refresh daily data
        run: python scripts/update_data.py

      - name: Commit changed snapshot
        run: |
          git config user.name "alphalens-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks.json
          git diff --cached --quiet || git commit -m "data: daily market refresh"
          git push
